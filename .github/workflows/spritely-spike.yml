name: Spritely Capability Spike

on:
  push:
    branches: [main]
    paths:
      - "networking/**"
      - ".github/workflows/spritely-spike.yml"
  pull_request:
    paths:
      - "networking/**"
      - ".github/workflows/spritely-spike.yml"
  workflow_dispatch:

jobs:
  goblins-and-hoot:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Run Goblins CapTP and Hoot compile probes
        run: networking/spritely/run_spike.sh
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: spritely-hoot-room-smoke
          path: build/spritely/
          if-no-files-found: error
