name: Spritely Capability Spike

on:
  push:
    branches:
      - networking/spritely-executable-spike
    paths:
      - "networking/**"
      - ".github/workflows/spritely-spike.yml"
  workflow_dispatch:

jobs:
  goblins-and-hoot:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Run Goblins CapTP and Hoot compile probes
        run: |
          docker run --rm             -v "$GITHUB_WORKSPACE:/work"             -w /work             debian:sid             bash -lc '
              set -euo pipefail
              export DEBIAN_FRONTEND=noninteractive
              apt-get update
              apt-get install -y --no-install-recommends                 ca-certificates                 guile-3.0                 guile-goblins                 guile-hoot                 guile-websocket                 nodejs

              timeout 60s guile networking/spritely/captp_room_smoke.scm

              mkdir -p build/spritely
              GOBLINS_FILE="$(guile -c "(display (%search-load-path \"goblins.scm\"))")"
              GOBLINS_SITE_ROOT="$(dirname "$GOBLINS_FILE")"

              # Debian installs Goblins and Hoot into the same Guile site root.
              # Passing that whole directory to Hoot makes its library-group
              # builder ingest Hoot's own host-side modules. Copy only Goblins
              # into an isolated module root so -L contains guest libraries only.
              GOBLINS_HOOT_ROOT=/tmp/starjunk-goblins-hoot
              mkdir -p "$GOBLINS_HOOT_ROOT"
              cp "$GOBLINS_FILE" "$GOBLINS_HOOT_ROOT/goblins.scm"
              cp -a "$GOBLINS_SITE_ROOT/goblins" "$GOBLINS_HOOT_ROOT/goblins"

              hoot compile                 -L "$GOBLINS_HOOT_ROOT"                 --run                 networking/spritely/hoot_room_smoke.scm

              hoot compile                 -L "$GOBLINS_HOOT_ROOT"                 --bundle=build/spritely                 -o build/spritely/starjunk-spritely-room.wasm                 networking/spritely/hoot_room_smoke.scm

              test -s build/spritely/starjunk-spritely-room.wasm
            '
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: spritely-hoot-room-smoke
          path: build/spritely/
          if-no-files-found: error
