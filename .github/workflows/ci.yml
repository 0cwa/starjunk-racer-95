name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  repository:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: make check

  godot-smoke:
    runs-on: ubuntu-24.04
    env:
      GODOT_VERSION: "4.7.2"
    steps:
      - uses: actions/checkout@v4
      - name: Download Godot
        run: |
          curl -fL --retry 3             -o /tmp/godot.zip             "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64
          echo "GODOT_BIN=/tmp/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64" >> "$GITHUB_ENV"
      - name: Import project
        run: '"$GODOT_BIN" --headless --path game --editor --quit-after 2'
      - name: Run vehicle handling foundation tests
        run: '"$GODOT_BIN" --headless --path game res://tests/unit/vehicle_handling_test.tscn'
      - name: Run handling assist model tests
        run: '"$GODOT_BIN" --headless --path game res://tests/unit/handling_assist_model_test.tscn'
      - name: Run tire force model tests
        run: '"$GODOT_BIN" --headless --path game res://tests/unit/tire_force_model_test.tscn'
      - name: Run longitudinal tire force tests
        run: '"$GODOT_BIN" --headless --path game res://tests/unit/longitudinal_tire_force_test.tscn'
      - name: Run wheel slip kinematics tests
        run: '"$GODOT_BIN" --headless --path game res://tests/unit/wheel_slip_kinematics_test.tscn'
      - name: Run wheel rotation model tests
        run: '"$GODOT_BIN" --headless --path game res://tests/unit/wheel_rotation_model_test.tscn'
      - name: Run suspension model tests
        run: '"$GODOT_BIN" --headless --path game res://tests/unit/suspension_model_test.tscn'
      - name: Run raycast vehicle integration test
        run: '"$GODOT_BIN" --headless --fixed-fps 60 --path game res://tests/integration/raycast_vehicle_test.tscn'
      - name: Run playable prototype race integration test
        run: 'timeout 45s "$GODOT_BIN" --headless --fixed-fps 60 --path game res://tests/integration/prototype_race_test.tscn'
      - name: Run vehicle telemetry accumulator tests
        run: '"$GODOT_BIN" --headless --path game res://tests/unit/vehicle_telemetry_accumulator_test.tscn'
      - name: Characterize prototype vehicle
        run: |
          "$GODOT_BIN" --headless --fixed-fps 60 --path game             res://tests/characterization/vehicle_characterization.tscn --             "--output=$GITHUB_WORKSPACE/vehicle-characterization.json"
          test -s vehicle-characterization.json
      - uses: actions/upload-artifact@v4
        with:
          name: vehicle-characterization
          path: vehicle-characterization.json
          if-no-files-found: error
      - name: Run song cue timeline tests
        run: '"$GODOT_BIN" --headless --path game res://tests/unit/song_cue_timeline_test.tscn'
      - name: Run course presentation director tests
        run: '"$GODOT_BIN" --headless --path game res://tests/unit/course_presentation_director_test.tscn'
      - name: Run race protocol tests
        run: '"$GODOT_BIN" --headless --path game res://tests/unit/race_protocol_test.tscn'
      - name: Run community package safety tests
        run: '"$GODOT_BIN" --headless --path game res://tests/unit/content_package_test.tscn'
      - name: Run safe package archive staging tests
        run: 'timeout 30s "$GODOT_BIN" --headless --path game res://tests/unit/community_package_archive_test.tscn'
      - name: Run package content identity tests
        run: 'timeout 30s "$GODOT_BIN" --headless --path game res://tests/unit/community_package_identity_test.tscn'
      - name: Run content-addressed community library tests
        run: 'timeout 45s "$GODOT_BIN" --headless --path game res://tests/unit/community_content_library_test.tscn'
      - name: Run community car runtime importer tests
        run: '"$GODOT_BIN" --headless --path game res://tests/unit/community_car_importer_test.tscn'
      - name: Run community track runtime importer tests
        run: 'timeout 30s "$GODOT_BIN" --headless --path game res://tests/unit/community_track_importer_test.tscn'
      - name: Run community race bundle integration test
        run: 'timeout 45s "$GODOT_BIN" --headless --path game res://tests/integration/community_race_bundle_test.tscn'
      - name: Run community content playable race test
        run: 'timeout 45s "$GODOT_BIN" --headless --fixed-fps 60 --path game res://tests/integration/community_content_playable_race_test.tscn'
      - name: Run community content service end-to-end test
        run: 'timeout 60s "$GODOT_BIN" --headless --fixed-fps 60 --path game res://tests/integration/community_content_service_test.tscn'
      - name: Load renderer torture scene
        run: '"$GODOT_BIN" --headless --path game res://tests/perf/renderer_torture/renderer_torture.tscn --quit-after 20'
