name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  repository:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: make check

  godot-smoke:
    runs-on: ubuntu-24.04
    env:
      GODOT_VERSION: "4.7.2"
    steps:
      - uses: actions/checkout@v4
      - name: Download Godot
        run: |
          curl -fL --retry 3             -o /tmp/godot.zip             "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64
          echo "GODOT_BIN=/tmp/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64" >> "$GITHUB_ENV"
      - name: Import project
        run: '"$GODOT_BIN" --headless --path game --editor --quit-after 2'
      - name: Run vehicle handling foundation tests
        run: '"$GODOT_BIN" --headless --path game res://tests/unit/vehicle_handling_test.tscn'
      - name: Load renderer torture scene
        run: '"$GODOT_BIN" --headless --path game res://tests/perf/renderer_torture/renderer_torture.tscn --quit-after 20'
